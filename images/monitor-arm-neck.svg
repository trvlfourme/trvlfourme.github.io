<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgNeck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgNeck)" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#334155" stroke-width="2" />

  <!-- человек в профиль -->
  <g>
    <circle cx="150" cy="118" r="42" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <circle cx="118" cy="126" r="7" fill="#64748b" />
    <circle cx="182" cy="112" r="5" fill="#fbbf24" />
    <path d="M 158 158 L 166 196" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round" />
    <path d="M 128 330 L 132 244 Q 138 204 166 198 Q 194 204 200 244 L 204 330 Z"
          fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <path d="M 176 272 Q 236 300 300 318" fill="none" stroke="#e2e8f0" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- стол -->
  <rect x="40" y="330" width="740" height="14" rx="3" fill="#94a3b8" />
  <rect x="740" y="344" width="18" height="76" fill="#475569" />

  <!-- кронштейн -->
  <rect x="726" y="322" width="54" height="14" rx="3" fill="#cbd5e1" />
  <rect x="734" y="200" width="14" height="124" fill="#64748b" />
  <path d="M 741 208 Q 722 192 694 198" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" />

  <!-- монитор -->
  <rect x="420" y="110" width="274" height="180" rx="8" fill="#0b1220" stroke="#94a3b8" stroke-width="2" />
  <rect x="430" y="120" width="254" height="160" rx="4" fill="#1e293b" />
  <rect x="430" y="120" width="254" height="53" fill="#38bdf8" opacity="0.18" />
  <line x1="430" y1="173" x2="684" y2="173" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  <text x="557" y="312" font-family="system-ui, sans-serif" font-size="11" font-weight="700"
        fill="#cbd5e1" text-anchor="middle">верхняя треть на уровне глаз</text>

  <!-- уровень глаз -->
  <line x1="196" y1="110" x2="418" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 6" />
  <text x="316" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700"
        fill="#94a3b8" text-anchor="middle">уровень глаз</text>

  <!-- линия взгляда и угол -->
  <line x1="182" y1="112" x2="556" y2="195" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="560" cy="196" r="4" fill="#fbbf24" />
  <path d="M 302 112 A 120 120 0 0 1 299 136" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <text x="318" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="800"
        fill="#38bdf8">15–20°</text>

  <!-- расстояние от глаз до экрана -->
  <line x1="210" y1="250" x2="418" y2="250" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="210" y1="242" x2="210" y2="258" stroke="#f59e0b" stroke-width="2" />
  <line x1="418" y1="242" x2="418" y2="258" stroke="#f59e0b" stroke-width="2" />
  <text x="314" y="240" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800"
        fill="#fbbf24" text-anchor="middle">50–70 см</text>

  <!-- заголовок -->
  <g transform="translate(400, 40)">
    <rect x="-220" y="-18" width="440" height="34" rx="8" fill="#0b1220" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800"
          fill="#f8fafc" text-anchor="middle" letter-spacing="1">ВЫСОТА МОНИТОРА И ШЕЯ</text>
  </g>
</svg>
