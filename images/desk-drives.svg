<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgDrives" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgDrives)" />
  <rect x="0" y="370" width="800" height="80" fill="#09090b" />
  <line x1="0" y1="370" x2="800" y2="370" stroke="#3f3f46" stroke-width="2" />

  <!-- 1. Две телескопические колонны -->
  <g transform="translate(70, 300)">
    <rect x="0" y="0" width="170" height="16" rx="4" fill="#d4d4d8" />
    <rect x="20" y="16" width="20" height="40" fill="#71717a" />
    <rect x="24" y="56" width="12" height="30" fill="#52525b" />
    <rect x="130" y="16" width="20" height="40" fill="#71717a" />
    <rect x="134" y="56" width="12" height="30" fill="#52525b" />
    <rect x="8" y="86" width="46" height="8" rx="2" fill="#3f3f46" />
    <rect x="118" y="86" width="46" height="8" rx="2" fill="#3f3f46" />
    <text x="85" y="126" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24"
          text-anchor="middle">две колонны</text>
    <text x="85" y="146" font-family="system-ui, sans-serif" font-size="10.5" fill="#d4d4d8"
          text-anchor="middle">устойчиво, 45–50 дБ</text>
    <text x="85" y="-14" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8"
          text-anchor="middle">рост 160–190 см</text>
  </g>

  <!-- 2. Ножничный механизм -->
  <g transform="translate(315, 300)">
    <rect x="0" y="0" width="170" height="16" rx="4" fill="#d4d4d8" />
    <path d="M 20 16 L 150 86 M 150 16 L 20 86" stroke="#a1a1aa" stroke-width="7" stroke-linecap="round" />
    <rect x="26" y="86" width="118" height="9" rx="2" fill="#3f3f46" />
    <text x="85" y="126" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24"
          text-anchor="middle">ножницы</text>
    <text x="85" y="146" font-family="system-ui, sans-serif" font-size="10.5" fill="#d4d4d8"
          text-anchor="middle">ход меньше, ниже цена</text>
    <text x="85" y="-14" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8"
          text-anchor="middle">ход 20–30 см</text>
  </g>

  <!-- 3. Одна стойка -->
  <g transform="translate(560, 300)">
    <rect x="0" y="0" width="170" height="16" rx="4" fill="#d4d4d8" />
    <rect x="74" y="16" width="22" height="52" fill="#71717a" />
    <rect x="79" y="68" width="12" height="18" fill="#52525b" />
    <rect x="40" y="86" width="90" height="9" rx="3" fill="#3f3f46" />
    <text x="85" y="126" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24"
          text-anchor="middle">одна стойка</text>
    <text x="85" y="146" font-family="system-ui, sans-serif" font-size="10.5" fill="#d4d4d8"
          text-anchor="middle">лёгкий, для ноутбука</text>
    <text x="85" y="-14" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8"
          text-anchor="middle">нагрузка до 40 кг</text>
  </g>

  <!-- заголовок -->
  <g transform="translate(400, 40)">
    <rect x="-220" y="-18" width="440" height="34" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800"
          fill="#f8fafc" text-anchor="middle" letter-spacing="1">ТРИ ПРИВОДА ПОДЪЁМНОГО СТОЛА</text>
  </g>
</svg>
