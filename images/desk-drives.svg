<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgDrives" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgDrives)" />
  <line x1="40" y1="300" x2="760" y2="300" stroke="#3f3f46" stroke-width="2" />

  <!-- 1. Две телескопические колонны -->
  <g>
    <text x="160" y="146" font-family="system-ui, sans-serif" font-size="11" font-weight="700"
          fill="#38bdf8" text-anchor="middle">рост 160–190 см</text>
    <rect x="70" y="166" width="180" height="16" rx="4" fill="#d4d4d8" />
    <rect x="90" y="182" width="22" height="72" fill="#71717a" />
    <rect x="96" y="254" width="10" height="36" fill="#52525b" />
    <rect x="208" y="182" width="22" height="72" fill="#71717a" />
    <rect x="214" y="254" width="10" height="36" fill="#52525b" />
    <rect x="76" y="288" width="52" height="8" rx="2" fill="#3f3f46" />
    <rect x="192" y="288" width="52" height="8" rx="2" fill="#3f3f46" />
    <text x="160" y="326" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800"
          fill="#fbbf24" text-anchor="middle">две колонны</text>
    <text x="160" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#d4d4d8"
          text-anchor="middle">устойчиво, 45–50 дБ</text>
  </g>

  <!-- 2. Ножничный механизм -->
  <g>
    <text x="400" y="146" font-family="system-ui, sans-serif" font-size="11" font-weight="700"
          fill="#38bdf8" text-anchor="middle">ход 20–30 см</text>
    <rect x="310" y="166" width="180" height="16" rx="4" fill="#d4d4d8" />
    <path d="M 330 182 L 470 288 M 470 182 L 330 288" stroke="#a1a1aa" stroke-width="7" stroke-linecap="round" />
    <rect x="324" y="287" width="152" height="9" rx="2" fill="#3f3f46" />
    <text x="400" y="326" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800"
          fill="#fbbf24" text-anchor="middle">ножницы</text>
    <text x="400" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#d4d4d8"
          text-anchor="middle">ход меньше, ниже цена</text>
  </g>

  <!-- 3. Одна стойка -->
  <g>
    <text x="640" y="146" font-family="system-ui, sans-serif" font-size="11" font-weight="700"
          fill="#38bdf8" text-anchor="middle">нагрузка до 40 кг</text>
    <rect x="550" y="166" width="180" height="16" rx="4" fill="#d4d4d8" />
    <rect x="629" y="182" width="22" height="94" fill="#71717a" />
    <rect x="635" y="276" width="10" height="10" fill="#52525b" />
    <rect x="595" y="286" width="90" height="10" rx="3" fill="#3f3f46" />
    <text x="640" y="326" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800"
          fill="#fbbf24" text-anchor="middle">одна стойка</text>
    <text x="640" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#d4d4d8"
          text-anchor="middle">лёгкий, для ноутбука</text>
  </g>

  <!-- заголовок -->
  <g transform="translate(400, 40)">
    <rect x="-220" y="-18" width="440" height="34" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800"
          fill="#f8fafc" text-anchor="middle" letter-spacing="1">ТРИ ПРИВОДА ПОДЪЁМНОГО СТОЛА</text>
  </g>
</svg>
