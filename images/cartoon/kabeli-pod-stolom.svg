<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <linearGradient id="bgCable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221d1d" />
      <stop offset="100%" stop-color="#120f10" />
    </linearGradient>
    <radialGradient id="warmCable" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="trayMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3230" />
      <stop offset="100%" stop-color="#241f1e" />
    </linearGradient>
  </defs>

  <rect width="1376" height="768" fill="url(#bgCable)" />
  <rect width="1376" height="768" fill="url(#warmCable)" />

  <!-- подписи «было / стало» -->
  <text x="300" y="96" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ef4444" text-anchor="middle" letter-spacing="2">БЫЛО</text>
  <text x="1040" y="96" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="2">СТАЛО</text>
  <line x1="690" y1="48" x2="690" y2="716" stroke="#4a3f39" stroke-width="3" stroke-dasharray="10 12" />

  <!-- стол и ноги -->
  <rect x="40" y="160" width="1296" height="40" rx="8" fill="#4a3f39" />
  <rect x="40" y="160" width="1296" height="6" rx="3" fill="#5d5049" />
  <rect x="110" y="200" width="28" height="440" fill="#3a3130" />
  <rect x="1238" y="200" width="28" height="440" fill="#3a3130" />

  <!-- пол -->
  <rect x="0" y="640" width="1376" height="128" fill="#171213" />
  <line x1="0" y1="640" x2="1376" y2="640" stroke="#3a3130" stroke-width="2" />

  <!-- ЛЕВАЯ ЧАСТЬ: клубок проводов и кот -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 250 q80 90 20 170 q-50 70 40 120 q80 45 130 -20 q40 -60 -20 -110 q-60 -50 -110 -10" stroke="#f59e0b" stroke-width="11" />
    <path d="M180 230 q120 30 150 120 q25 80 -60 120 q-80 35 -110 -40 q-25 -70 45 -95" stroke="#38bdf8" stroke-width="10" />
    <path d="M230 210 q160 120 260 40 q70 -55 20 -90" stroke="#34d399" stroke-width="10" />
    <path d="M160 420 q60 90 170 80 q120 -10 130 -90 q8 -70 -60 -90" stroke="#ef4444" stroke-width="10" />
    <path d="M150 200 q40 60 10 110" stroke="#a78bfa" stroke-width="9" />
    <path d="M300 300 q70 -40 120 10 q40 40 -10 80" stroke="#e7e5e4" stroke-width="8" />
  </g>
  <ellipse cx="330" cy="600" rx="120" ry="24" fill="#0f0c0d" fill-opacity="0.55" />

  <!-- кот -->
  <g>
    <path d="M540 520 q60 10 60 46 q0 34 -50 40" fill="none" stroke="#3a3230" stroke-width="22" stroke-linecap="round" />
    <ellipse cx="430" cy="520" rx="104" ry="66" fill="#3a3230" />
    <ellipse cx="430" cy="536" rx="66" ry="40" fill="#4a4140" />
    <circle cx="330" cy="452" r="54" fill="#3a3230" />
    <path d="M288 418 l-6 -40 l38 20 z" fill="#3a3230" />
    <path d="M372 418 l6 -40 l-38 20 z" fill="#3a3230" />
    <ellipse cx="324" cy="446" rx="9" ry="11" fill="#fbbf24" />
    <ellipse cx="360" cy="446" rx="9" ry="11" fill="#fbbf24" />
    <ellipse cx="324" cy="446" rx="3" ry="8" fill="#1c1917" />
    <ellipse cx="360" cy="446" rx="3" ry="8" fill="#1c1917" />
    <path d="M334 472 q10 8 20 0" fill="none" stroke="#1c1917" stroke-width="4" stroke-linecap="round" />
    <path d="M312 470 l-30 -6 M312 478 l-30 6 M372 470 l30 -6 M372 478 l30 6" stroke="#6b615f" stroke-width="3" stroke-linecap="round" />
    <!-- провод в зубах -->
    <path d="M352 484 q60 30 30 76 q-25 38 -90 24" fill="none" stroke="#f59e0b" stroke-width="11" stroke-linecap="round" />
    <ellipse cx="392" cy="560" rx="30" ry="14" fill="#3a3230" />
  </g>

  <!-- тапок и носок в хаосе -->
  <g>
    <ellipse cx="178" cy="606" rx="46" ry="18" fill="#38bdf8" opacity="0.7" />
    <ellipse cx="178" cy="599" rx="30" ry="10" fill="#7dd3fc" opacity="0.8" />
    <ellipse cx="268" cy="618" rx="46" ry="18" fill="#38bdf8" opacity="0.5" />
    <ellipse cx="268" cy="611" rx="30" ry="10" fill="#7dd3fc" opacity="0.6" />
  </g>

  <!-- ПРАВАЯ ЧАСТЬ: лоток и порядок -->
  <rect x="748" y="220" width="470" height="48" rx="10" fill="url(#trayMetal)" stroke="#554a46" stroke-width="3" />
  <g stroke-linecap="round">
    <line x1="762" y1="236" x2="1206" y2="236" stroke="#f59e0b" stroke-width="7" />
    <line x1="762" y1="248" x2="1206" y2="248" stroke="#38bdf8" stroke-width="7" />
    <line x1="762" y1="256" x2="1206" y2="256" stroke="#34d399" stroke-width="6" />
    <line x1="762" y1="262" x2="1140" y2="262" stroke="#e7e5e4" stroke-width="5" />
  </g>
  <rect x="860" y="226" width="18" height="42" rx="5" fill="#1c1917" opacity="0.6" />
  <rect x="990" y="226" width="18" height="42" rx="5" fill="#1c1917" opacity="0.6" />
  <rect x="1120" y="226" width="18" height="42" rx="5" fill="#1c1917" opacity="0.6" />
  <!-- провод уходит к столу по клипсе -->
  <path d="M1206 240 q40 -10 34 -46" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  <rect x="1228" y="196" width="16" height="14" rx="4" fill="#fbbf24" />
  <path d="M1236 220 q-6 60 4 120" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  <rect x="1228" y="300" width="18" height="14" rx="4" fill="#fbbf24" />
  <path d="M1236 352 q-8 90 2 160" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  <rect x="1230" y="430" width="18" height="14" rx="4" fill="#fbbf24" />
  <!-- бирки на проводах -->
  <g>
    <rect x="880" y="284" width="46" height="20" rx="6" fill="#f59e0b" />
    <rect x="950" y="284" width="46" height="20" rx="6" fill="#38bdf8" />
    <rect x="1020" y="284" width="46" height="20" rx="6" fill="#34d399" />
  </g>
  <!-- удлинитель -->
  <rect x="880" y="540" width="230" height="52" rx="10" fill="#2f2926" stroke="#554a46" stroke-width="3" />
  <circle cx="916" cy="566" r="11" fill="#1c1917" />
  <circle cx="960" cy="566" r="11" fill="#1c1917" />
  <circle cx="1004" cy="566" r="11" fill="#1c1917" />
  <circle cx="1048" cy="566" r="11" fill="#1c1917" />
  <rect x="1066" y="558" width="26" height="16" rx="4" fill="#34d399" />
  <path d="M880 592 q-20 40 -4 56" fill="none" stroke="#e7e5e4" stroke-width="7" stroke-linecap="round" />

  <!-- провода из лотка вниз к удлинителю: ровные, по линии -->
  <g stroke-linecap="round" fill="none">
    <path d="M946 268 v268" stroke="#f59e0b" stroke-width="7" />
    <path d="M982 268 v268" stroke="#38bdf8" stroke-width="7" />
    <path d="M1018 268 v268" stroke="#34d399" stroke-width="7" />
  </g>

  <!-- канал вдоль ноги стола -->
  <rect x="1224" y="268" width="40" height="360" rx="8" fill="#2f2926" stroke="#4a3f39" stroke-width="3" />
  <line x1="1236" y1="286" x2="1236" y2="610" stroke="#f59e0b" stroke-width="6" />
  <line x1="1252" y1="286" x2="1252" y2="610" stroke="#38bdf8" stroke-width="6" />

  <!-- запасной кабель в бухте на крючке -->
  <rect x="786" y="352" width="14" height="34" rx="5" fill="#554a46" />
  <g fill="none" stroke="#a78bfa" stroke-width="9" stroke-linecap="round">
    <circle cx="858" cy="424" r="40" />
    <circle cx="858" cy="424" r="26" />
  </g>
  <rect x="851" y="376" width="14" height="96" rx="5" fill="#fbbf24" />

  <!-- подпись -->
  <rect x="48" y="690" width="440" height="46" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" />
  <text x="268" y="719" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fef3c7" text-anchor="middle">КАБИНЕТ ДОМА · ПРОВОДА ПОД СТОЛОМ</text>
</svg>
