<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <linearGradient id="bgCableL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f8f9" />
      <stop offset="100%" stop-color="#e7eaee" />
    </linearGradient>
    <linearGradient id="trayMetalL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3dbd3" />
      <stop offset="100%" stop-color="#cdc4bb" />
    </linearGradient>
  </defs>

  <rect width="1376" height="768" fill="url(#bgCableL)" />

  <!-- подписи «было / стало» -->
  <text x="300" y="96" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#dc2626" text-anchor="middle" letter-spacing="2">БЫЛО</text>
  <text x="1040" y="96" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#0f9d6b" text-anchor="middle" letter-spacing="2">СТАЛО</text>
  <line x1="690" y1="48" x2="690" y2="716" stroke="#c3b9b0" stroke-width="3" stroke-dasharray="10 12" />

  <!-- стол и ноги -->
  <rect x="40" y="160" width="1296" height="40" rx="8" fill="#d3a97c" />
  <rect x="40" y="160" width="1296" height="6" rx="3" fill="#e6c8a6" />
  <rect x="110" y="200" width="28" height="440" fill="#b78e63" />
  <rect x="1238" y="200" width="28" height="440" fill="#b78e63" />

  <!-- пол -->
  <rect x="0" y="640" width="1376" height="128" fill="#e4dad1" />
  <line x1="0" y1="640" x2="1376" y2="640" stroke="#d2c6bb" stroke-width="2" />

  <!-- ЛЕВАЯ ЧАСТЬ: клубок проводов и кот -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 250 q80 90 20 170 q-50 70 40 120 q80 45 130 -20 q40 -60 -20 -110 q-60 -50 -110 -10" stroke="#f59e0b" stroke-width="11" />
    <path d="M180 230 q120 30 150 120 q25 80 -60 120 q-80 35 -110 -40 q-25 -70 45 -95" stroke="#0ea5e9" stroke-width="10" />
    <path d="M230 210 q160 120 260 40 q70 -55 20 -90" stroke="#10b981" stroke-width="10" />
    <path d="M160 420 q60 90 170 80 q120 -10 130 -90 q8 -70 -60 -90" stroke="#ef4444" stroke-width="10" />
    <path d="M150 200 q40 60 10 110" stroke="#8b5cf6" stroke-width="9" />
    <path d="M300 300 q70 -40 120 10 q40 40 -10 80" stroke="#94a3b8" stroke-width="8" />
  </g>
  <ellipse cx="330" cy="600" rx="120" ry="24" fill="#cfc2b6" fill-opacity="0.7" />

  <!-- кот -->
  <g>
    <path d="M540 520 q60 10 60 46 q0 34 -50 40" fill="none" stroke="#6b615f" stroke-width="22" stroke-linecap="round" />
    <ellipse cx="430" cy="520" rx="104" ry="66" fill="#6b615f" />
    <ellipse cx="430" cy="536" rx="66" ry="40" fill="#8b807a" />
    <circle cx="330" cy="452" r="54" fill="#6b615f" />
    <path d="M288 418 l-6 -40 l38 20 z" fill="#6b615f" />
    <path d="M372 418 l6 -40 l-38 20 z" fill="#6b615f" />
    <ellipse cx="324" cy="446" rx="9" ry="11" fill="#fbbf24" />
    <ellipse cx="360" cy="446" rx="9" ry="11" fill="#fbbf24" />
    <ellipse cx="324" cy="446" rx="3" ry="8" fill="#241f1c" />
    <ellipse cx="360" cy="446" rx="3" ry="8" fill="#241f1c" />
    <path d="M334 472 q10 8 20 0" fill="none" stroke="#241f1c" stroke-width="4" stroke-linecap="round" />
    <path d="M312 470 l-30 -6 M312 478 l-30 6 M372 470 l30 -6 M372 478 l30 6" stroke="#a89b8e" stroke-width="3" stroke-linecap="round" />
    <!-- провод в зубах -->
    <path d="M352 484 q60 30 30 76 q-25 38 -90 24" fill="none" stroke="#f59e0b" stroke-width="11" stroke-linecap="round" />
    <ellipse cx="392" cy="560" rx="30" ry="14" fill="#6b615f" />
  </g>

  <!-- тапки в хаосе -->
  <g>
    <ellipse cx="178" cy="606" rx="46" ry="18" fill="#38bdf8" opacity="0.75" />
    <ellipse cx="178" cy="599" rx="30" ry="10" fill="#bae6fd" opacity="0.9" />
    <ellipse cx="268" cy="618" rx="46" ry="18" fill="#38bdf8" opacity="0.55" />
    <ellipse cx="268" cy="611" rx="30" ry="10" fill="#bae6fd" opacity="0.7" />
  </g>

  <!-- ПРАВАЯ ЧАСТЬ: лоток и порядок -->
  <rect x="748" y="220" width="470" height="48" rx="10" fill="url(#trayMetalL)" stroke="#bdb2a8" stroke-width="3" />
  <g stroke-linecap="round">
    <line x1="762" y1="236" x2="1206" y2="236" stroke="#f59e0b" stroke-width="7" />
    <line x1="762" y1="248" x2="1206" y2="248" stroke="#0ea5e9" stroke-width="7" />
    <line x1="762" y1="256" x2="1206" y2="256" stroke="#10b981" stroke-width="6" />
    <line x1="762" y1="262" x2="1140" y2="262" stroke="#94a3b8" stroke-width="5" />
  </g>
  <rect x="860" y="226" width="18" height="42" rx="5" fill="#8a7f76" opacity="0.7" />
  <rect x="990" y="226" width="18" height="42" rx="5" fill="#8a7f76" opacity="0.7" />
  <rect x="1120" y="226" width="18" height="42" rx="5" fill="#8a7f76" opacity="0.7" />
  <!-- провод уходит к столу по клипсе -->
  <path d="M1206 240 q40 -10 34 -46" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" />
  <rect x="1228" y="196" width="16" height="14" rx="4" fill="#f59e0b" />
  <path d="M1236 220 q-6 60 4 120" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" />
  <rect x="1228" y="300" width="18" height="14" rx="4" fill="#f59e0b" />
  <path d="M1236 352 q-8 90 2 160" fill="none" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" />
  <rect x="1230" y="430" width="18" height="14" rx="4" fill="#f59e0b" />
  <!-- бирки на проводах -->
  <g>
    <rect x="880" y="284" width="46" height="20" rx="6" fill="#f59e0b" />
    <rect x="950" y="284" width="46" height="20" rx="6" fill="#0ea5e9" />
    <rect x="1020" y="284" width="46" height="20" rx="6" fill="#10b981" />
  </g>
  <!-- удлинитель -->
  <rect x="880" y="540" width="230" height="52" rx="10" fill="#eae3db" stroke="#c6bab0" stroke-width="3" />
  <circle cx="916" cy="566" r="11" fill="#9a8f86" />
  <circle cx="960" cy="566" r="11" fill="#9a8f86" />
  <circle cx="1004" cy="566" r="11" fill="#9a8f86" />
  <circle cx="1048" cy="566" r="11" fill="#9a8f86" />
  <rect x="1066" y="558" width="26" height="16" rx="4" fill="#34d399" />
  <path d="M880 592 q-20 40 -4 56" fill="none" stroke="#b8aca1" stroke-width="7" stroke-linecap="round" />

  <!-- провода из лотка вниз к удлинителю -->
  <g stroke-linecap="round" fill="none">
    <path d="M946 268 v268" stroke="#f59e0b" stroke-width="7" />
    <path d="M982 268 v268" stroke="#0ea5e9" stroke-width="7" />
    <path d="M1018 268 v268" stroke="#10b981" stroke-width="7" />
  </g>

  <!-- канал вдоль ноги стола -->
  <rect x="1224" y="268" width="40" height="360" rx="8" fill="#e0d8d0" stroke="#c6bab0" stroke-width="3" />
  <line x1="1236" y1="286" x2="1236" y2="610" stroke="#f59e0b" stroke-width="6" />
  <line x1="1252" y1="286" x2="1252" y2="610" stroke="#0ea5e9" stroke-width="6" />

  <!-- запасной кабель в бухте на крючке -->
  <rect x="786" y="352" width="14" height="34" rx="5" fill="#b8aca1" />
  <g fill="none" stroke="#8b5cf6" stroke-width="9" stroke-linecap="round">
    <circle cx="858" cy="424" r="40" />
    <circle cx="858" cy="424" r="26" />
  </g>
  <rect x="851" y="376" width="14" height="96" rx="5" fill="#f59e0b" />

  <!-- подпись -->
  <rect x="52" y="676" width="588" height="74" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
  <text x="346" y="726" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#3a2c1c" text-anchor="middle">ПРОВОДА ПОД СТОЛОМ</text>
</svg>
