<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <linearGradient id="bgWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ef" />
      <stop offset="100%" stop-color="#ece1d5" />
    </linearGradient>
    <linearGradient id="skyPlace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfe6fb" />
      <stop offset="100%" stop-color="#a9d3f5" />
    </linearGradient>
  </defs>

  <rect width="1376" height="768" fill="url(#bgWall)" />

  <!-- стена и пол -->
  <rect x="0" y="610" width="1376" height="158" fill="#e7dbcf" />
  <line x1="0" y1="610" x2="1376" y2="610" stroke="#d3c6b8" stroke-width="2" />

  <!-- световой поток от окна вбок, на стол -->
  <polygon points="410,120 980,470 900,610 240,610" fill="#fde68a" fill-opacity="0.28" />

  <!-- окно -->
  <rect x="80" y="80" width="340" height="360" rx="12" fill="url(#skyPlace)" />
  <rect x="80" y="80" width="340" height="360" rx="12" fill="none" stroke="#e0d5c9" stroke-width="14" />
  <line x1="250" y1="80" x2="250" y2="440" stroke="#e0d5c9" stroke-width="10" />
  <line x1="80" y1="260" x2="420" y2="260" stroke="#e0d5c9" stroke-width="10" />
  <circle cx="170" cy="170" r="34" fill="#fde68a" />
  <rect x="64" y="440" width="372" height="18" rx="6" fill="#e6dccf" />

  <!-- батарея -->
  <g>
    <rect x="470" y="470" width="240" height="30" rx="8" fill="#ece6df" stroke="#cfc4b8" stroke-width="3" />
    <rect x="470" y="500" width="240" height="110" rx="10" fill="#ece6df" stroke="#cfc4b8" stroke-width="3" />
    <g stroke="#d8cec2" stroke-width="8" stroke-linecap="round">
      <line x1="500" y1="520" x2="500" y2="590" /><line x1="530" y1="520" x2="530" y2="590" />
      <line x1="560" y1="520" x2="560" y2="590" /><line x1="590" y1="520" x2="590" y2="590" />
      <line x1="620" y1="520" x2="620" y2="590" /><line x1="650" y1="520" x2="650" y2="590" />
      <line x1="680" y1="520" x2="680" y2="590" />
    </g>
    <path d="M500 610 v18 M680 610 v18" stroke="#cfc4b8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- подсказки -->
  <g>
    <rect x="110" y="470" width="230" height="42" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
    <text x="225" y="497" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#b45309" text-anchor="middle">СВЕТ СБОКУ</text>
  </g>
  <g>
    <rect x="470" y="404" width="270" height="42" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2" />
    <path d="M492 414 l22 22 M514 414 l-22 22" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <text x="615" y="431" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">НЕ ПОД БАТАРЕЕЙ</text>
  </g>

  <!-- стол -->
  <ellipse cx="1020" cy="706" rx="270" ry="20" fill="#d6c5b2" fill-opacity="0.5" />
  <rect x="760" y="430" width="540" height="26" rx="8" fill="#d3a97c" />
  <rect x="760" y="430" width="540" height="5" rx="2.5" fill="#e6c8a6" />
  <rect x="790" y="456" width="26" height="146" fill="#b78e63" />
  <rect x="1244" y="456" width="26" height="146" fill="#b78e63" />

  <!-- ноутбук спиной к нам -->
  <rect x="860" y="342" width="200" height="88" rx="10" fill="#64748b" stroke="#4a5a70" stroke-width="2" />
  <circle cx="960" cy="386" r="14" fill="#94a3b8" />
  <rect x="880" y="422" width="160" height="10" rx="4" fill="#475569" />

  <!-- кружка на столе -->
  <rect x="1108" y="380" width="46" height="50" rx="9" fill="#ef4444" />
  <path d="M1154 390 a14 14 0 0 1 0 26" fill="none" stroke="#ef4444" stroke-width="7" />

  <!-- розетка с вилкой -->
  <rect x="1216" y="250" width="66" height="86" rx="8" fill="#ffffff" stroke="#d6cbc0" stroke-width="3" />
  <circle cx="1240" cy="286" r="6" fill="#b8aca1" />
  <circle cx="1258" cy="286" r="6" fill="#b8aca1" />
  <rect x="1236" y="322" width="26" height="22" rx="5" fill="#334155" />
  <path d="M1249 344 q-8 44 -8 86" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />

  <!-- подпись -->
  <rect x="48" y="690" width="400" height="46" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
  <text x="248" y="719" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#3a2c1c" text-anchor="middle">КАБИНЕТ ДОМА · КУДА ПОСТАВИТЬ СТОЛ</text>
</svg>
